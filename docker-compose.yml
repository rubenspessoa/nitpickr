services:
  db:
    # pgvector is required by the memories.embedding column (migration 8).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nitpickr
      POSTGRES_USER: nitpickr
      POSTGRES_PASSWORD: nitpickr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nitpickr -d nitpickr"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["node", "dist/src/cli/index.js", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["node", "--import", "./dist/src/observability/instrument.js", "dist/src/api/index.js"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["node", "--import", "./dist/src/observability/instrument.js", "dist/src/worker/index.js"]
    restart: unless-stopped
    # Lets the worker reach a model server on the Docker host (e.g. Ollama at
    # http://host.docker.internal:11434/v1). No-op on Docker Desktop, needed on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
